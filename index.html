<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de login</title>
    <link rel="stylesheet" href="src/publico/styles/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

    <header class="login-header">
        <nav class="login-header__nav">
            <div class="login-header__logo">WB</div>
            <ul class="login-header__links">
                <li><a href="https://william-brito-dev.github.io/portifolio/" rel="external noopener noreferrer">Home</a></li>
                <li><a href="mailto:contato.williambrito.dev@hotmail.com">Contato</a></li>
            </ul>
        </nav>
    </header>

    <main class="login-page">
          <form class="login-form" id="formLogin">
            <h1 class="login-form__title">WB</h1>
            
            <div class="login-form__input-group">
                <input id="email" placeholder="E-mail" type="email" required>
                <label for="email" class="sr-only">E-mail</label>
                <img src="src/publico/imgs/usuario.png" class="login-form__input-icon" alt="Ícone de usuário">
            </div>
            
            <div class="login-form__input-group">
                <input id="password" placeholder="Senha" type="password" required>
                <label for="password" class="sr-only">Senha</label>
                <img src="src/publico/imgs/senha.png" class="login-form__input-icon" alt="Ícone de senha">
            </div>
            
            <div class="login-form__extra">
                <label class="login-form__checkbox-label">
                    <input type="checkbox" class="login-form__checkbox">
                    Mantenha-me logado
                </label>
                <a href="#" class="login-form__forgot-link">Esqueci senha</a>
            </div>
            
            <button type="submit" class="login-form__button" id="btnLogar">Login</button>
            
            <p id="mensagem-feedback" class="login-form__feedback" style="display: none;"></p>

            <div class="login-form__register">
                <p>Não tem uma conta? <a href="#" class="login-form__register-link">Cadastre-se!</a></p>
            </div>
          </form>  
    </main>
    <script src="src/server/script.js"></script>
</body>
</html>
